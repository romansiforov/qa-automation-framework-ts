name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    # Playwright 1.64 WebKit needs libicu74, which ubuntu-latest (Ubuntu 26) no longer ships.
    runs-on: ubuntu-24.04
    env:
      # The suite registers its own user. These values only satisfy CONFIG validation.
      USER_EMAIL: ci-user@example.com
      USER_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Quality gates
        run: npm run quality:check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Generate Allure report
        id: allure
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Publish Allure report to GitHub Pages
        if: >-
          ${{
            !cancelled() &&
            steps.allure.outcome == 'success' &&
            github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            allure-report/
          retention-days: 14
          if-no-files-found: ignore
